name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  actions: read
  contents: read

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v5

      # Project files are linted and format-checked by the affected `lint` targets below
      - name: Lint and check formatting of workspace-level files
        run: pnpm lint:workspace

      - name: Restore .NET dependencies
        run: pnpm exec nx run-many -t restore

      - name: Run affected lint, typecheck, build and test
        run: pnpm exec nx affected -t lint typecheck build test

      # No-ops until the workspace contains a project that depends on @playwright/test
      - name: Install Playwright browser
        run: scripts/install-playwright-deps.sh

      - name: Run affected end-to-end tests
        run: pnpm exec nx affected -t e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: '**/playwright-report'
          if-no-files-found: ignore
          retention-days: 7
